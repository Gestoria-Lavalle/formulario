<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes — Estudio Lavalle & Asoc.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0f1e3d; --navy2:#1a2f5e; --gold:#c9a84c; --gold2:#e8c96a;
  --bg:#0a1628; --surface:#111f38; --surface2:#162540;
  --text:#e8edf2; --text2:#8899aa; --border:rgba(255,255,255,0.07);
  --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{background:var(--navy);padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{width:38px;height:38px;background:var(--gold);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy);font-weight:bold}
.header-info h1{font-family:'DM Serif Display',serif;color:#fff;font-size:16px;font-weight:400}
.header-info p{color:var(--gold);font-size:11px}
.header-btns{margin-left:auto;display:flex;gap:8px}
.btn-nav{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;transition:background 0.2s}
.btn-nav:hover{background:rgba(255,255,255,0.15)}
.btn-nav.gold{background:rgba(201,168,76,0.2);border-color:rgba(201,168,76,0.4);color:var(--gold)}

.container{max-width:1300px;margin:0 auto;padding:24px 20px}

/* FILTROS */
.filtros{background:var(--surface);border-radius:14px;padding:18px 20px;margin-bottom:24px;border:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.filtro-group{display:flex;flex-direction:column;gap:5px}
.filtro-group label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
.filtro-group input,.filtro-group select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.filtro-group input:focus,.filtro-group select:focus{border-color:var(--gold)}
.btn-filtrar{background:var(--gold);color:var(--navy);border:none;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}

/* KPI CARDS */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.kpi-val{font-size:22px;font-weight:700;color:var(--gold);font-family:'DM Serif Display',serif}
.kpi-label{font-size:11px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}

/* GRID DE SECCIONES */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{font-family:'DM Serif Display',serif;font-size:15px;font-weight:400;color:var(--gold);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* TABLAS */
.mini-table{width:100%;border-collapse:collapse;font-size:12.5px}
.mini-table th{text-align:left;padding:6px 10px;color:var(--text2);font-weight:500;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.mini-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.04)}
.mini-table tr:hover td{background:rgba(201,168,76,0.05)}
.mini-table .num{text-align:right;font-family:monospace}
.rank{color:var(--gold);font-weight:700;width:24px}

/* BARRAS */
.barra-wrap{margin:6px 0}
.barra-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.barra{background:rgba(255,255,255,0.06);border-radius:4px;height:8px;overflow:hidden}
.barra-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 0.6s ease}

/* SALDOS */
.saldo-org{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.saldo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.saldo-nombre{font-weight:600;font-size:14px}
.saldo-monto{font-size:18px;font-weight:700;font-family:'DM Serif Display',serif}
.saldo-monto.positivo{color:var(--green)}
.saldo-monto.bajo{color:var(--yellow)}
.saldo-monto.negativo{color:var(--red)}
.saldo-acreditar{display:flex;gap:8px;margin-top:10px}
.saldo-acreditar input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.saldo-acreditar input:focus{border-color:var(--gold)}
.btn-acreditar{background:var(--green);color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.movimientos{font-size:11px;color:var(--text2);margin-top:6px}
.mov-item{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.mov-pos{color:var(--green)}
.mov-neg{color:var(--red)}

.loading{text-align:center;padding:40px;color:var(--text2);font-size:14px}
.sug-item{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text)}
.sug-item:hover{background:rgba(201,168,76,0.1);color:var(--gold)}
.badge-estado{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-pendiente{background:rgba(245,158,11,0.2);color:#f59e0b}
.badge-proceso{background:rgba(59,130,246,0.2);color:#60a5fa}
.badge-listo{background:rgba(16,185,129,0.2);color:#10b981}
.badge-entregado{background:rgba(16,185,129,0.15);color:#6ee7b7}
</style>
</head>
<body>

<header>
  <div class="logo">L</div>
  <div class="header-info">
    <h1>Estudio Lavalle & Asoc.</h1>
    <p>Reportes y Estadísticas</p>
  </div>
  <div class="header-btns">
    <a href="/panel_lavalle.html" class="btn-nav gold">← Volver al Panel</a>
  </div>
</header>

<div class="container">

  <!-- FILTROS -->
  <div class="filtros">
    <div class="filtro-group">
      <label>Desde</label>
      <input type="date" id="f-desde">
    </div>
    <div class="filtro-group">
      <label>Hasta</label>
      <input type="date" id="f-hasta">
    </div>
    <div class="filtro-group">
      <label>Organismo</label>
      <select id="f-organismo">
        <option value="">Todos</option>
        <option>RPI-CABA</option>
        <option>RPI-PBA</option>
        <option>Catastro GCBA</option>
        <option>ARBA</option>
        <option>Protocolos Notariales</option>
      </select>
    </div>
    <div class="filtro-group">
      <label>Estado</label>
      <select id="f-estado">
        <option value="">Todos</option>
        <option>Pendiente</option>
        <option>En proceso</option>
        <option>Listo</option>
        <option>Entregado</option>
      </select>
    </div>
    <div class="filtro-group" style="position:relative">
      <label>Cliente</label>
      <input type="text" id="f-cliente" placeholder="Buscar cliente..." autocomplete="off"
        oninput="filtrarSugerencias()" onfocus="filtrarSugerencias()" onblur="setTimeout(()=>hideSugerencias(),200)">
      <div id="sugerencias" style="display:none;position:absolute;top:100%;left:0;right:0;background:#162540;border:1px solid rgba(201,168,76,0.3);border-radius:8px;max-height:200px;overflow-y:auto;z-index:100;margin-top:2px"></div>
    </div>
    <button class="btn-filtrar" onclick="aplicarFiltros()">🔍 Filtrar</button>
    <button class="btn-filtrar" style="background:rgba(255,255,255,0.1);color:#fff" onclick="limpiarFiltros()">✕ Limpiar</button>
  </div>

  <!-- KPIs -->
  <div class="kpis" id="kpis">
    <div class="loading">Cargando datos...</div>
  </div>

  <!-- FILA 1: Por organismo + Estados -->
  <div class="grid2">
    <div class="card" id="card-organismos">
      <h3>📊 Por Organismo</h3>
      <div class="loading">Cargando...</div>
    </div>
    <div class="card" id="card-estados">
      <h3>📋 Por Estado</h3>
      <div class="loading">Cargando...</div>
    </div>
  </div>

  <!-- FILA 2: Ranking clientes -->
  <div class="card" style="margin-bottom:24px" id="card-clientes">
    <h3>🏆 Ranking de Clientes</h3>
    <div class="loading">Cargando...</div>
  </div>

  <!-- FILA 3: Saldos por organismo -->
  <div class="card" id="card-saldos">
    <h3>💰 Saldos por Organismo</h3>
    <div id="saldos-content"><div class="loading">Cargando...</div></div>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzma66TR1P6WHj14iRQ9xvZc5xLKR86GGP9mc6uRNV08dxFi11Dz7n5lfbqUaJEqHYTVw/exec';
const ORGANISMOS_SALDO = ['RPI-CABA', 'RPI-PBA', 'ARBA'];

let allTramites = [];
let allClientes = [];
let allSaldos = [];

// Fechas por defecto: último mes
const hoy = new Date();
const hace30 = new Date(); hace30.setDate(hoy.getDate() - 30);
document.getElementById('f-desde').value = hace30.toISOString().slice(0,10);
document.getElementById('f-hasta').value = hoy.toISOString().slice(0,10);

window.onload = cargarDatos;

function filtrarSugerencias() {
  const val = document.getElementById('f-cliente').value.toLowerCase();
  const div = document.getElementById('sugerencias');
  // Obtener lista única de clientes
  const clientes = [...new Set(allTramites.map(t => t.cliente).filter(Boolean))].sort();
  const filtrados = val ? clientes.filter(c => c.toLowerCase().includes(val)) : clientes;
  if (filtrados.length === 0) { div.style.display = 'none'; return; }
  div.innerHTML = filtrados.slice(0, 15).map(c =>
    `<div class="sug-item" onmousedown="seleccionarCliente('${c.replace(/'/g, '\u2019')}')">${c}</div>`
  ).join('');
  div.style.display = 'block';
}

function seleccionarCliente(nombre) {
  document.getElementById('f-cliente').value = nombre;
  hideSugerencias();
  aplicarFiltros();
}

function hideSugerencias() {
  document.getElementById('sugerencias').style.display = 'none';
}

async function cargarDatos() {
  try {
    const url = APPS_SCRIPT_URL + '?datos=' + encodeURIComponent(JSON.stringify({ accion: 'obtenerReportes' }));
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error);
    allTramites = data.tramites || [];
    allClientes = data.clientes || [];
    allSaldos   = data.saldos || [];
    aplicarFiltros();
    renderSaldos();
  } catch(e) {
    document.getElementById('kpis').innerHTML = `<div style="color:#ef4444;padding:20px">Error: ${e.message}</div>`;
  }
}

function parseFecha(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length === 3) return new Date(p[2], p[1]-1, p[0]);
  return new Date(str);
}

function aplicarFiltros() {
  const desde  = document.getElementById('f-desde').value ? new Date(document.getElementById('f-desde').value) : null;
  const hasta  = document.getElementById('f-hasta').value ? new Date(document.getElementById('f-hasta').value + 'T23:59:59') : null;
  const org    = document.getElementById('f-organismo').value;
  const estado = document.getElementById('f-estado').value;
  const cli    = document.getElementById('f-cliente').value.toLowerCase();

  const filtrado = allTramites.filter(t => {
    const f = parseFecha(t.fecha);
    if (desde && f && f < desde) return false;
    if (hasta && f && f > hasta) return false;
    if (org && t.organismo !== org) return false;
    if (estado && t.estado !== estado) return false;
    if (cli && !String(t.cliente).toLowerCase().includes(cli)) return false;
    return true;
  });

  renderKPIs(filtrado);
  renderOrganismos(filtrado);
  renderEstados(filtrado);
  renderClientes(filtrado);
}

function limpiarFiltros() {
  document.getElementById('f-desde').value = '';
  document.getElementById('f-hasta').value = '';
  document.getElementById('f-organismo').value = '';
  document.getElementById('f-estado').value = '';
  document.getElementById('f-cliente').value = '';
  aplicarFiltros();
}

function fmt(n) { return '$' + (parseFloat(n)||0).toLocaleString('es-AR'); }

function renderKPIs(data) {
  const totalFacturado  = data.reduce((s,t) => s + (t.importe||0), 0);
  const totalAranceles  = data.reduce((s,t) => s + (t.arancel||0), 0);
  const totalHonorarios = data.reduce((s,t) => s + (t.honorario||0), 0);
  const cobrado = data.filter(t => t.pago === 'Si').reduce((s,t) => s + (t.importe||0), 0);
  const pendPago = totalFacturado - cobrado;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-val">${data.length}</div><div class="kpi-label">Trámites</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(totalFacturado)}</div><div class="kpi-label">Total Facturado</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(totalAranceles)}</div><div class="kpi-label">Aranceles</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--green)">${fmt(totalHonorarios)}</div><div class="kpi-label">Honorarios</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--green)">${fmt(cobrado)}</div><div class="kpi-label">Cobrado</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--yellow)">${fmt(pendPago)}</div><div class="kpi-label">Pendiente Cobro</div></div>
  `;
}

function renderOrganismos(data) {
  const map = {};
  data.forEach(t => {
    if (!map[t.organismo]) map[t.organismo] = { cant:0, facturado:0, honorarios:0 };
    map[t.organismo].cant++;
    map[t.organismo].facturado += t.importe||0;
    map[t.organismo].honorarios += t.honorario||0;
  });
  const maxFact = Math.max(...Object.values(map).map(v => v.facturado), 1);
  const rows = Object.entries(map).sort((a,b) => b[1].facturado - a[1].facturado);

  document.getElementById('card-organismos').innerHTML = `
    <h3>📊 Por Organismo</h3>
    ${rows.map(([org, v]) => `
      <div class="barra-wrap">
        <div class="barra-label">
          <span>${org} <span style="color:var(--text2);font-size:11px">(${v.cant} trám.)</span></span>
          <span style="color:var(--gold)">${fmt(v.facturado)}</span>
        </div>
        <div class="barra"><div class="barra-fill" style="width:${Math.round(v.facturado/maxFact*100)}%"></div></div>
        <div style="font-size:11px;color:var(--text2);text-align:right;margin-top:2px">Hon: ${fmt(v.honorarios)}</div>
      </div>
    `).join('')}
    ${rows.length === 0 ? '<div style="color:var(--text2);font-size:13px">Sin datos</div>' : ''}
  `;
}

function renderEstados(data) {
  const map = {};
  data.forEach(t => {
    const e = t.estado || 'Pendiente';
    if (!map[e]) map[e] = 0;
    map[e]++;
  });
  const badges = { 'Pendiente':'badge-pendiente','En proceso':'badge-proceso','Listo':'badge-listo','Entregado':'badge-entregado' };
  const rows = Object.entries(map).sort((a,b) => b[1]-a[1]);
  const total = data.length || 1;

  document.getElementById('card-estados').innerHTML = `
    <h3>📋 Por Estado</h3>
    ${rows.map(([est, cant]) => `
      <div class="barra-wrap">
        <div class="barra-label">
          <span class="badge-estado ${badges[est]||'badge-pendiente'}">${est}</span>
          <span>${cant} (${Math.round(cant/total*100)}%)</span>
        </div>
        <div class="barra"><div class="barra-fill" style="width:${Math.round(cant/total*100)}%"></div></div>
      </div>
    `).join('')}
    ${rows.length === 0 ? '<div style="color:var(--text2);font-size:13px">Sin datos</div>' : ''}
  `;
}

function renderClientes(data) {
  const map = {};
  data.forEach(t => {
    const c = t.cliente || 'Sin nombre';
    if (!map[c]) map[c] = { cant:0, facturado:0, honorarios:0, cobrado:0 };
    map[c].cant++;
    map[c].facturado += t.importe||0;
    map[c].honorarios += t.honorario||0;
    if (t.pago === 'Si') map[c].cobrado += t.importe||0;
  });
  const rows = Object.entries(map).sort((a,b) => b[1].facturado - a[1].facturado).slice(0, 20);

  document.getElementById('card-clientes').innerHTML = `
    <h3>🏆 Ranking de Clientes</h3>
    <table class="mini-table">
      <thead><tr>
        <th>#</th><th>Cliente</th><th class="num">Trámites</th>
        <th class="num">Facturado</th><th class="num">Honorarios</th><th class="num">Cobrado</th>
      </tr></thead>
      <tbody>
        ${rows.map(([cli, v], i) => `
          <tr>
            <td class="rank">${i+1}</td>
            <td>${cli}</td>
            <td class="num">${v.cant}</td>
            <td class="num" style="color:var(--gold)">${fmt(v.facturado)}</td>
            <td class="num" style="color:var(--green)">${fmt(v.honorarios)}</td>
            <td class="num" style="color:${v.cobrado < v.facturado ? '#f59e0b' : 'var(--green)'}">${fmt(v.cobrado)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    ${rows.length === 0 ? '<div style="color:var(--text2);font-size:13px;padding:10px">Sin datos con los filtros aplicados</div>' : ''}
  `;
}

function renderSaldos() {
  const calcSaldo = (org) => {
    return allSaldos
      .filter(s => s.organismo === org)
      .reduce((sum, s) => sum + (parseFloat(s.monto)||0), 0);
  };

  const getMovimientos = (org) => {
    return allSaldos
      .filter(s => s.organismo === org)
      .slice(-5)
      .reverse()
      .map(s => {
        const m = parseFloat(s.monto)||0;
        return `<div class="mov-item">
          <span>${s.fecha} — ${s.concepto}</span>
          <span class="${m >= 0 ? 'mov-pos' : 'mov-neg'}">${m >= 0 ? '+' : ''}${fmt(m)}</span>
        </div>`;
      }).join('');
  };

  document.getElementById('saldos-content').innerHTML = ORGANISMOS_SALDO.map(org => {
    const saldo = calcSaldo(org);
    const clase = saldo > 10000 ? 'positivo' : saldo > 0 ? 'bajo' : 'negativo';
    const movs = getMovimientos(org);
    return `
      <div class="saldo-org">
        <div class="saldo-header">
          <span class="saldo-nombre">${org}</span>
          <span class="saldo-monto ${clase}">${fmt(saldo)}</span>
        </div>
        ${movs ? `<div class="movimientos">${movs}</div>` : ''}
        <div class="saldo-acreditar">
          <input type="number" id="acred-${org.replace(/[^a-z]/gi,'')}" placeholder="Monto a acreditar">
          <input type="text" id="conc-${org.replace(/[^a-z]/gi,'')}" placeholder="Concepto (opcional)" style="flex:2">
          <button class="btn-acreditar" onclick="acreditarSaldo('${org}')">+ Acreditar</button>
        </div>
      </div>
    `;
  }).join('');
}

async function acreditarSaldo(org) {
  const key = org.replace(/[^a-z]/gi,'');
  const monto = parseFloat(document.getElementById('acred-' + key)?.value);
  const concepto = document.getElementById('conc-' + key)?.value || 'Depósito';
  if (!monto || monto <= 0) { alert('Ingresá un monto válido'); return; }

  try {
    const payload = { accion: 'acreditarSaldo', organismo: org, monto, concepto };
    await fetch(APPS_SCRIPT_URL + '?datos=' + encodeURIComponent(JSON.stringify(payload)));
    allSaldos.push({ fecha: new Date().toLocaleDateString('es-AR'), organismo: org, tipo: 'Acreditación', monto, concepto });
    renderSaldos();
    document.getElementById('acred-' + key).value = '';
    document.getElementById('conc-' + key).value = '';
  } catch(e) {
    alert('Error al acreditar: ' + e.message);
  }
}
</script>
</body>
</html>
