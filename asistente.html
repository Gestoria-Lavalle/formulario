function addQuickOptions(options) {
  const div = document.createElement('div');
  div.className = 'quick-options';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      div.remove();
      sendText(opt);
    };
    div.appendChild(btn);
  });
  document.getElementById('chatContainer').appendChild(div);
  scrollBottom();
}

function addMessage(role, html, withOptions = false) {
  const container = document.getElementById('chatContainer');
  
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'ai' ? 'L' : '👤';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = html;
  
  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  scrollBottom();

  if (withOptions && role === 'ai') {
    setTimeout(() => {
      addQuickOptions(['✅ Ya tengo los datos listos', '❓ Necesito ayuda', '💰 Solo quiero un presupuesto']);
    }, 300);
  }

  return bubble;
}

  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">L</div><div class="typing"><span></span><span></span><span></span></div>`;
  container.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function scrollBottom() {
  const c = document.getElementById('chatContainer');
  c.scrollTop = c.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  pendingFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('filePreview').style.display = 'flex';
  
  const reader = new FileReader();
  reader.onload = e => {
    pendingFileBase64 = e.target.result.split(',')[1];
  };
  reader.readAsDataURL(file);
}

function removeFile() {
  pendingFile = null;
  pendingFileBase64 = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('filePreview').style.display = 'none';
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  const messageText = text || `📎 Adjunté: ${pendingFile?.name}`;
  input.value = '';
  input.style.height = 'auto';
  
  addMessage('user', messageText);
  
  const fileToSend = pendingFile;
  const fileBase64 = pendingFileBase64;
  removeFile();

  document.getElementById('sendBtn').disabled = true;
  showTyping();

  // Armar mensaje para Claude
  let userContent;
  if (fileToSend && fileBase64) {
    const isImage = fileToSend.type.startsWith('image/');
    const isPDF = fileToSend.type === 'application/pdf';
    
    if (isImage) {
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: fileToSend.type, data: fileBase64 }},
        { type: 'text', text: text || 'Por favor analizá este documento y extraé los datos relevantes para el trámite.' }
      ];
    } else if (isPDF) {
      userContent = [
        { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: fileBase64 }},
        { type: 'text', text: text || 'Por favor analizá este documento y extraé los datos relevantes para el trámite.' }
      ];
    } else {
      userContent = text;
    }
  } else {
    userContent = text;
  }

  conversation.push({ role: 'user', content: userContent });

  try {
    const response = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: SYSTEM_PROMPT,
        messages: conversation
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || 'Lo siento, hubo un error. Intentá de nuevo.';
    
    conversation.push({ role: 'assistant', content: reply });

    removeTyping();

    // Verificar si hay presupuesto en la respuesta
    const presupMatch = reply.match(/\[PRESUPUESTO_JSON\](.*?)\[\/PRESUPUESTO_JSON\]/s);
    if (presupMatch) {
      try {
        pendingPresupuesto = JSON.parse(presupMatch[1]);
        const cleanReply = reply.replace(/\[PRESUPUESTO_JSON\].*?\[\/PRESUPUESTO_JSON\]/s, '').trim();
        addMessage('ai', formatText(cleanReply));
        showPresupuesto(pendingPresupuesto);
      } catch(e) {
        addMessage('ai', formatText(reply));
      }
    } else {
      addMessage('ai', formatText(reply));
    }

  } catch(err) {
    removeTyping();
    addMessage('ai', 'Hubo un error de conexión. Por favor intentá de nuevo.');
    console.error(err);
  }

  // Detectar CLIENTE_JSON en la respuesta del asistente
  if (!pendingCliente && reply) {
    const clienteMatch = reply.match(/\[CLIENTE_JSON\]([\s\S]*?)\[\/CLIENTE_JSON\]/);
    if (clienteMatch) {
      try {
        pendingCliente = JSON.parse(clienteMatch[1].trim());
        console.log('Cliente detectado:', pendingCliente);
      } catch(e) { console.warn('Error parseando CLIENTE_JSON:', e); }
    }
  }

  // Detectar comprobante de pago
  if (esperandoComprobante && fileToSend) {
    await registrarPedidoEnSheet();
  }

  document.getElementById('sendBtn').disabled = false;
  setTimeout(scrollBottom, 100);
}

function sendText(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>')
    .replace(/- (.*?)(<br>|$)/g, '• $1$2');
}

function showPresupuesto(data) {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'msg ai';
  
  let itemsHtml = data.tramites.map((t, i) => `
    <div class="presupuesto-item">
      <span>${i+1}. ${t.organismo} — ${t.tipo} ${t.caracter}</span>
      <span><strong>$${t.precio.toLocaleString('es-AR')}</strong></span>
    </div>
  `).join('');

  div.innerHTML = `
    <div class="msg-avatar">L</div>
    <div class="msg-bubble" style="max-width:85%">
      <div class="presupuesto-card">
        <h3>📋 Resumen del Pedido</h3>
        ${itemsHtml}
        <div class="presupuesto-total">
          <span>Total</span>
          <span>$${data.total.toLocaleString('es-AR')}</span>
        </div>
        <div class="confirm-btns">
          <button class="btn-confirm yes" onclick="confirmarPedido()">✅ Confirmar pedido</button>
          <button class="btn-confirm no" onclick="sendText('Quiero modificar el pedido')">✏️ Modificar</button>
        </div>
      </div>
    </div>
  `;
  
  container.appendChild(div);
  scrollBottom();
}

async function confirmarPedido() {
  if (!pendingPresupuesto) return;
  
  addMessage('user', '✅ Confirmo el pedido');

  // Pedir datos del cliente si no los tenemos
  if (!pendingCliente) {
    addMessage('ai', '¡Perfecto! Antes de continuar necesito algunos datos para registrar el pedido.<br><br>Por favor indicame tu <strong>apellido y nombre</strong>, <strong>empresa/inmobiliaria</strong> (opcional) y <strong>WhatsApp</strong>.');
    esperandoComprobante = false;
    return;
  }

  mostrarDatosBancarios();
}

function mostrarDatosBancarios() {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <div class="msg-avatar">L</div>
    <div class="msg-bubble">
      <strong>¡Perfecto!</strong> Para procesar tu pedido, realizá la transferencia por el monto total:<br><br>
      <div class="bank-card">
        <h4>💳 Datos para transferencia</h4>
        <p><strong>Banco:</strong> Banco Ciudad</p>
        <p><strong>Cuenta:</strong> Caja de Ahorro $ 000000520200348863</p>
        <p><strong>CBU:</strong> 0290052010000003488639</p>
        <p><strong>Alias:</strong> LAVALLE.ESTUDIO</p>
        <p><strong>Titular:</strong> Mauro Raul Garone / Natalia Soledad Lavalle</p>
        <p><strong>CUIT/CUIL:</strong> 20-26405610-2 / 23-29583017-4</p>
        <p><strong>Monto:</strong> <strong>$${pendingPresupuesto.total.toLocaleString('es-AR')}</strong></p>
      </div>
      <br>Una vez realizado el pago, adjuntá el comprobante acá y lo verificamos. 🙏
    </div>
  `;
  container.appendChild(div);
  scrollBottom();
  esperandoComprobante = true;
}

async function registrarPedidoEnSheet() {
  if (!pendingPresupuesto || !pendingCliente) return;

  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzma66TR1P6WHj14iRQ9xvZc5xLKR86GGP9mc6uRNV08dxFi11Dz7n5lfbqUaJEqHYTVw/exec';

  const tramites = pendingPresupuesto.tramites.map(t => ({
    organismo: t.organismo,
    tipo: t.tipo,
    caracter: t.caracter,
    importe: t.precio,
    arancel: 0,
    ...t.datos
  }));

  const payload = {
    cliente: pendingCliente,
    org: tramites[0]?.organismo || '',
    tramites: tramites
  };

  try {
    const url = APPS_SCRIPT_URL + '?datos=' + encodeURIComponent(JSON.stringify(payload));
    const resp = await fetch(url);
    const result = await resp.json();
    if (result.ok) {
      addMessage('ai', `✅ <strong>Pedido #${result.nroPedido} registrado correctamente.</strong><br><br>Natalia ya puede verlo en el panel y se pondrá en contacto para confirmar el pago y coordinar la entrega. ¡Gracias por confiar en el Estudio Lavalle!`);
      pendingPresupuesto = null;
      pendingCliente = null;
      esperandoComprobante = false;
    }
  } catch(e) {
    console.error('Error registrando pedido:', e);
  }
}
</script>
