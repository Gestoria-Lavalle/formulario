<style>

  font-size: 17px;

}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.header-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--white);
  padding: 7px 14px;
  border-radius: 8px;

  cursor: pointer;
  text-decoration: none;
  font-family: 'DM Sans', sans-serif;

}
.header-btn:hover { background: rgba(255,255,255,0.2); }

  flex: 1;
  max-width: 800px;

  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  padding-bottom: 180px;
}

.msg {
  display: flex;
  gap: 10px;
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
}

.msg.ai .msg-avatar { background: var(--navy); color: var(--gold); font-family: 'DM Serif Display', serif; }
.msg.user .msg-avatar { background: var(--gold); color: var(--navy); }

.msg-bubble {
  max-width: 75%;
  padding: 13px 16px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.6;
}

.msg.ai .msg-bubble {
  background: var(--bubble-ai);
  color: var(--text);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.msg.user .msg-bubble {
  background: var(--bubble-user);
  color: var(--white);
  border-bottom-right-radius: 4px;
}

.msg-bubble strong { font-weight: 600; }
.msg-bubble ul { padding-left: 18px; margin: 6px 0; }
.msg-bubble li { margin: 3px 0; }

.quick-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.quick-btn {
  background: var(--cream);
  border: 1.5px solid var(--gold);
  color: var(--navy);
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  font-weight: 500;
}

.quick-btn:hover {
  background: var(--gold);
  color: var(--navy);
}

  border-radius: 14px;
  padding: 18px;
  margin-top: 10px;

.presupuesto-card h3 {

  font-size: 16px;
  font-weight: 400;
  color: var(--gold);
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 8px;
}

.presupuesto-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 13.5px;
}

.presupuesto-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0 0;
  font-weight: 600;
  font-size: 15px;
  color: var(--gold);
}

.confirm-btns {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn-confirm {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.btn-confirm.yes { background: var(--gold); color: var(--navy); }
.btn-confirm.yes:hover { background: var(--gold-light); }
.btn-confirm.no { background: rgba(255,255,255,0.1); color: var(--white); border: 1px solid rgba(255,255,255,0.2); }

.typing {

  gap: 5px;
  padding: 14px 16px;
  background: var(--white);
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  width: fit-content;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.typing span {
  width: 7px;
  height: 7px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }

.input-inner {

  flex-direction: column;
  gap: 8px;

.input-row {

  gap: 8px;
  align-items: flex-end;

#userInput {

  padding: 12px 16px;
  border: 1.5px solid var(--cream-dark);
  border-radius: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;

  outline: none;
  background: var(--white);
  color: var(--text);
  max-height: 120px;
  min-height: 46px;
  transition: border 0.2s;
  line-height: 1.5;

#userInput:focus { border-color: var(--navy); }

.send-btn {

  height: 46px;
  background: var(--navy);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;

.send-btn:hover { background: var(--navy-mid); }
.send-btn svg { width: 18px; height: 18px; fill: var(--white); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.attach-btn {
  width: 46px;
  height: 46px;
  background: var(--cream-dark);
  border: 1.5px solid var(--cream-dark);
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  color: var(--text-dim);

.attach-btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }

#fileInput { display: none; }

.file-preview {

  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--cream-dark);
  font-size: 13px;
  color: var(--text);

.file-preview .remove-file {

  color: var(--error);
  font-size: 16px;
  line-height: 1;

/* IMAGEN ADJUNTA EN CHAT */
.msg-image {
  max-width: 200px;
  border-radius: 10px;
  margin-top: 6px;

/* DATOS BANCARIOS */
.bank-card {
  background: #f0f9f4;
  border: 1.5px solid #10b981;
  border-radius: 12px;
  padding: 14px;
  margin-top: 8px;
  font-size: 13.5px;
}

.bank-card h4 { color: #065f46; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.bank-card p { color: var(--text); margin: 3px 0; }
.bank-card strong { color: var(--navy); }
</style>
</head>

EXTRACCIÓN DE DOCUMENTOS:
Cuando el cliente sube una escritura o DNI, extraé:

- La UF de la matrícula y la UF de la dirección deben coincidir
- Si el cliente no pide inhibiciones explícitamente pero da datos de titulares → sugerí automáticamente una inhibición por cada titular

CÓMO LEER UNA ESCRITURA ARGENTINA — GUÍA BASADA EN CASOS REALES:

PASO 1 — LEER EL TÍTULO (primera línea en mayúsculas):
Siempre dice el acto y las partes. Ejemplo real:
"VENTA MITAD INDIVISA. ROUSSEAU, Alba Noemí a favor de ESTEVES, Edgardo Edmundo Alejandro"
→ Transmitente (NO pedir inhibición): ROUSSEAU, Alba Noemí
→ ADQUIRENTE (SÍ pedir inhibición): ESTEVES, Edgardo Edmundo Alejandro

Otro ejemplo: "DONACIÓN NUDA PROPIEDAD MITAD INDIVISA. ESTEVES, Edgardo Edmundo Alejandro a favor de ESTEVES ROSATI, Felicitas María"
→ Donante (NO): ESTEVES, Edgardo Edmundo Alejandro
→ Donataria/ADQUIRENTE (SÍ): ESTEVES ROSATI, Felicitas María

PASO 2 — IDENTIFICAR LOS COMPARECIENTES:
Buscá "POR UNA PARTE" y "POR OTRA PARTE" (o "POR LA OTRA PARTE"):
→ "POR UNA PARTE" = generalmente transmitente/vendedor/donante
→ "POR OTRA PARTE" = generalmente adquirente/comprador/donatario
→ Puede haber MÚLTIPLES personas en cada parte, separadas por punto y coma o "y"
→ Puede haber tercera parte (acreedor hipotecario, representante legal) — ignorar salvo indicación del cliente

Cada persona aparece como: APELLIDOS en mayúsculas, seguido de nombres, DNI, CUIL
Ejemplo: "Edgardo Edmundo Alejandro ESTEVES... Documento Nacional de Identidad número 17.871.858"
→ ap: Esteves, nom: Edgardo Edmundo Alejandro, tdoc: DNI, ndoc: 17871858

PASO 3 — ENCONTRAR LA MATRÍCULA:
Buscá "FRECS", "FR", "inscripta en la matrícula", "matrícula"
Formato: FR [circunscripción]-[número]/[UF]
Ejemplo real: "FRECS 19-2066/17" → circ: 19, mat: 2066, uf: 17
También aparece escrita a mano en la última hoja como "FR19-2066/17"
Si NO hay barra "/" → no hay UF (es finca, no PH)

PASO 4 — ENCONTRAR LA DIRECCIÓN:
Buscá "UNIDAD FUNCIONAL número... ubicado en... calle..." o "finca ubicada en..."
Los números pueden estar escritos en letras:
"calle PEÑA números TRES MIL CIENTO SESENTA Y UNO" → Peña 3161
"OCTAVO PISO, identificado con la letra B" → Piso 8 Depto B
Dirección completa del ejemplo: "Peña 3161 Piso 8 Dpto B CABA"

PASO 5 — NOMENCLATURA CATASTRAL:
Buscá "NOMENCLATURA CATASTRAL:" → Circunscripción, Sección, Manzana, Parcela
Ejemplo real: "Circunscripción: 19, Sección: 15, Manzana: 30, Parcela: 28"

function addQuickOptions(options) {
  const div = document.createElement('div');
  div.className = 'quick-options';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      div.remove();
      sendText(opt);
    };
    div.appendChild(btn);
  });
  document.getElementById('chatContainer').appendChild(div);
  scrollBottom();
}

function addMessage(role, html, withOptions = false) {
  const container = document.getElementById('chatContainer');
  
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'ai' ? 'L' : '👤';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = html;
  
  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  scrollBottom();

  if (withOptions && role === 'ai') {
    setTimeout(() => {
      addQuickOptions(['✅ Ya tengo los datos listos', '❓ Necesito ayuda', '💰 Solo quiero un presupuesto']);
    }, 300);
  }

  return bubble;
}

function showTyping() {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">L</div><div class="typing"><span></span><span></span><span></span></div>`;
  container.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function scrollBottom() {
  const c = document.getElementById('chatContainer');
  c.scrollTop = c.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  pendingFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('filePreview').style.display = 'flex';
  
  const reader = new FileReader();
  reader.onload = e => {
    pendingFileBase64 = e.target.result.split(',')[1];
  };
  reader.readAsDataURL(file);
}

function removeFile() {
  pendingFile = null;
  pendingFileBase64 = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('filePreview').style.display = 'none';
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  const messageText = text || `📎 Adjunté: ${pendingFile?.name}`;
  input.value = '';
  input.style.height = 'auto';
  
  addMessage('user', messageText);
  
  const fileToSend = pendingFile;
  const fileBase64 = pendingFileBase64;
  // Guardar el archivo para adjuntarlo al pedido cuando se confirme
  if (fileToSend && fileBase64) {
    adjuntoGuardado = { nombre: fileToSend.name, base64: fileBase64, tipo: fileToSend.type };
    console.log('Archivo guardado para adjuntar al pedido:', fileToSend.name);
  }
  removeFile();

  document.getElementById('sendBtn').disabled = true;
  showTyping();

  // Armar mensaje para Claude
  let userContent;
  if (fileToSend && fileBase64) {
    const isImage = fileToSend.type.startsWith('image/');
    const isPDF = fileToSend.type === 'application/pdf';
    
    if (isImage) {
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: fileToSend.type, data: fileBase64 }},
        { type: 'text', text: text || 'Por favor analizá este documento y extraé los datos relevantes para el trámite.' }
      ];
    } else if (isPDF) {
      userContent = [
        { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: fileBase64 }},
        { type: 'text', text: text || 'Por favor analizá este documento y extraé los datos relevantes para el trámite.' }
      ];
    } else {
      userContent = text;
    }
  } else {
    userContent = text;
  }

  conversation.push({ role: 'user', content: userContent });

  try {
    const response = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: SYSTEM_PROMPT,
        messages: conversation
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || 'Lo siento, hubo un error. Intentá de nuevo.';
    
    conversation.push({ role: 'assistant', content: reply });

    removeTyping();

    // Detectar CLIENTE_JSON en la respuesta del asistente
    if (!pendingCliente && reply) {
      const clienteMatch = reply.match(/\[CLIENTE_JSON\]([\s\S]*?)\[\/CLIENTE_JSON\]/);
      if (clienteMatch) {
        try {
          pendingCliente = JSON.parse(clienteMatch[1].trim());
          console.log('Cliente detectado:', pendingCliente);
        } catch(e) { console.warn('Error parseando CLIENTE_JSON:', e); }
      }
    }

    // Verificar si hay presupuesto en la respuesta
    const presupMatch = reply.match(/\[PRESUPUESTO_JSON\](.*?)\[\/PRESUPUESTO_JSON\]/s);
    if (presupMatch) {
      try {
        pendingPresupuesto = JSON.parse(presupMatch[1]);
        const cleanReply = reply.replace(/\[PRESUPUESTO_JSON\].*?\[\/PRESUPUESTO_JSON\]/s, '').trim();
        addMessage('ai', formatText(cleanReply));
        showPresupuesto(pendingPresupuesto);
      } catch(e) {
        addMessage('ai', formatText(reply));
      }
    } else {
      addMessage('ai', formatText(reply));
    }

  } catch(err) {
    removeTyping();
    addMessage('ai', 'Hubo un error de conexión. Por favor intentá de nuevo.');
    console.error(err);
  }

  document.getElementById('sendBtn').disabled = false;
  setTimeout(scrollBottom, 100);
}

function sendText(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>')
    .replace(/- (.*?)(<br>|$)/g, '• $1$2');
}
